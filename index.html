<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- MindAR Image Tracking Library -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="myVideo" src="thisha.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#myVideo" width="1" height="2" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

    </a-scene>

    <script>
      // Target Found / Lost Handler for Video Auto Play/Pause
      const sceneEl = document.querySelector('a-scene');
      const video = document.querySelector('#myVideo');
      
      sceneEl.addEventListener("targetFound", event => {
        console.log("Target found - Playing Video");
        video.play();
      });

      sceneEl.addEventListener("targetLost", event => {
        console.log("Target lost - Pausing Video");
        video.pause();
      });
    </script>
  </body>
</html>
